services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777,noexec,nosuid,nodev
    volumes:
      - signatures:/var/lib/clamav
      - clamav_logs:/var/log/clamav
volumes:
  signatures:
  clamav_logs:
